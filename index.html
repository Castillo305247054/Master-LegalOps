<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Master Legal - Captura de Demandas</title>
  <style>
    :root {
      --primario: #1e293b;
      --acento: #2563eb;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --texto: #0f172a;
      --borde: #cbd5e1;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--texto);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .recipiente {
      max-width: 650px;
      width: 100%;
      background: var(--card-bg);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    h2 {
      margin-top: 0;
      color: var(--primario);
      border-bottom: 2px solid var(--acento);
      padding-bottom: 8px;
    }

    .grupo-forma {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 0.9rem;
    }

    input[type="text"],
    input[type="number"],
    select,
    textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--borde);
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 0.95rem;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--acento);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    .fila {
      display: flex;
      gap: 15px;
    }

    .fila .grupo-forma {
      flex: 1;
    }

    .boton-enviar {
      width: 100%;
      background-color: var(--acento);
      color: white;
      border: none;
      padding: 12px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .boton-enviar:hover {
      background-color: #1d4ed8;
    }

    .boton-enviar:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="recipiente">
    <h2>⚖️ Registro Maestro Legal de Demandas</h2>
    <p style="font-size: 0.85rem; color: #64748b;">Ingresa la información clave de la demanda para sincronizar automáticamente con el archivo Master de GitHub y tus tableros en Power BI.</p>
    
    <form id="formularioDemanda" onsubmit="event.preventDefault(); enviarFormularioAWS();">
      
      <!-- Fila 1: Partes involucradas -->
      <div class="grupo-forma">
        <label for="demandante">Quejoso / Demandante *</label>
        <input type="text" id="demandante" placeholder="Ej. Juan Carlos Pérez López" required />
      </div>

      <div class="grupo-forma">
        <label for="demandado">Autoridad Responsable / Demandado *</label>
        <input type="text" id="demandado" placeholder="Ej. Juez Décimo de lo Civil de la CDMX" required />
      </div>

      <div class="grupo-forma">
        <label for="terceroInteresado">Tercero Interesado / Afectado</label>
        <input type="text" id="terceroInteresado" placeholder="Ej. Inmobiliaria del Centro SA de CV" />
      </div>

      <!-- Fila 2: Materia y Ciudad -->
      <div class="fila">
        <div class="grupo-forma">
          <label for="materia">Materia *</label>
          <select id="materia" required>
            <option value="Administrativo">Administrativo</option>
            <option value="Laboral">Laboral</option>
            <option value="Penal">Penal</option>
            <option value="Civil">Civil</option>
            <option value="Mercantil">Mercantil</option>
          </select>
        </div>

        <div class="grupo-forma">
          <label for="ciudad">Ciudad / Sede *</label>
          <input type="text" id="ciudad" placeholder="Ej. Ciudad de México" required />
        </div>
      </div>

      <!-- Fila 3: Circuito y Juzgado -->
      <div class="fila">
        <div class="grupo-forma">
          <label for="circuito">Circuito Judicial</label>
          <input type="text" id="circuito" placeholder="Ej. Primer Circuito" />
        </div>

        <div class="grupo-forma">
          <label for="montoReclamado">Monto Reclamado ($)</label>
          <input type="number" id="montoReclamado" placeholder="0.00" step="0.01" />
        </div>
      </div>

      <div class="grupo-forma">
        <label for="juzgado">Juzgado de Distrito / Órgano Jurisdiccional</label>
        <input type="text" id="juzgado" placeholder="Ej. Juzgado Tercero de Distrito en Materia Administrativa" />
      </div>

      <!-- Fila 4: Acto Reclamado -->
      <div class="grupo-forma">
        <label for="actoReclamado">Síntesis del Acto Reclamado</label>
        <textarea id="actoReclamado" placeholder="Describe brevemente la omisión o acto que se reclama..."></textarea>
      </div>

      <button type="submit" class="boton-enviar">Enviar Demanda a Master Legal</button>
    </form>
  </div>

  <!-- Vinculación directa con tu archivo app.js (donde vive la lógica de GitHub) -->
  <script src="app.js"></script>
</body>
</html>
